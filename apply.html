<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staff Application - NUKENOVA YT</title>
  <style>
    :root{
      --bg0:#070A12;
      --text:#EAF0FF;
      --muted:#A9B4DA;
      --brand:#7C5CFF;
      --brand2:#2EE9A6;
      --danger:#FF4D6D;
      --border: rgba(255,255,255,.14);
      --radius: 18px;
    }
    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg0);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .wrapper {
      width: min(650px, 100%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 6px 0; font-size: 26px; font-weight: 950; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; font-weight: 700; }
    form { display: grid; gap: 16px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px){ .row2 { grid-template-columns: 1fr; } }
    label { display: flex; flex-direction: column; gap: 7px; color: var(--muted); font-weight: 800; font-size: 13px; }
    input, textarea, select {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 12px;
      outline: none;
      font-weight: 750;
      font-size: 14px;
    }
    textarea { min-height: 120px; resize: vertical; }
    .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px; }
    .btn {
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.16);
      font-size: 14px;
    }
    .btn-back { background: rgba(255,255,255,.06); color: var(--text); text-decoration: none; display: inline-flex; align-items: center; }
    .btn-submit { background: linear-gradient(135deg, #7C5CFF, #2EE9A6); color: #07101C; border: none; }
    .notice { padding: 12px; border-radius: 16px; border: 1px solid rgba(46,233,166,.25); background: rgba(46,233,166,.08); color: #CFFAF0; font-weight: 800; display: none; margin-top: 10px; }
    .notice.error-notice { border-color: rgba(255,77,109,.25); background: rgba(255,77,109,.08); color: #FFD2DA; }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>Staff Application</h1>
    <div class="subtitle">Tell us about you (1 application allowed per Month)</div>

    <form id="ApplicationForm">
      <div class="row2">
        <label>
          Minecraft Username
          <input name="username" id="mcUsernameInput" required placeholder="e.g., TitanPlayer123" />
        </label>
        <label>
          Age (optional)
          <input name="age" placeholder="e.g., 16" inputmode="numeric" />
        </label>
      </div>

      <div class="row2">
        <label>
          Preferred Playstyle
          <select name="playstyle" required>
            <option value="survival">Survival</option>
            <option value="building">Building</option>
            <option value="pvp">PvP</option>
            <option value="events">Events</option>
            <option value="mixed" selected>Mixed</option>
          </select>
        </label>
        <label>
          Time Zone
          <input name="timezone" required placeholder="e.g., GMT+5 / EST" />
        </label>
      </div>

      <label>
        Why do you want to apply for staff?
        <textarea name="reason" required placeholder="Write a short introduction..."></textarea>
      </label>

      <label>
        Discord Username (for contact)
        <input name="discord" required placeholder="e.g., @titan" />
      </label>

      <div class="actions">
        <a href="index.html" class="btn btn-back">← Back to Home</a>
        <button class="btn btn-submit" type="submit" id="submitBtn">Submit Application</button>
      </div>

      <div class="notice" id="submitNotice"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('ApplicationForm');
    const notice = document.getElementById('submitNotice');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const username = formData.get('username').trim().toLowerCase();
      const originalUsername = formData.get('username').trim();
      const age = formData.get('age') || 'Not provided';
      const playstyle = formData.get('playstyle');
      const timezone = formData.get('timezone');
      const reason = formData.get('reason');
      const discord = formData.get('discord');

      const webhookUrl = "https://discord.com/api/webhooks/1508339526731567144/px9fqzuC9UnvAb3u3PMx3zE4g4VZdvypogOczkqwMI9iORALfFNKAHKkcdCrt5v6Wtyv";

      // --- 1 MAHINE KA COOLDOWN LOGIC ---
      const currentTime = new Date().getTime();
      const oneMonthInMilliseconds = 30 * 24 * 60 * 60 * 1000;
      const lastAppliedTime = localStorage.getItem(`cooldown_${username}`);

      if (lastAppliedTime) {
        const timePassed = currentTime - parseInt(lastAppliedTime);
        if (timePassed < oneMonthInMilliseconds) {
          const timeLeft = oneMonthInMilliseconds - timePassed;
          const daysLeft = Math.ceil(timeLeft / (24 * 60 * 60 * 1000));
          notice.innerText = `Error: This username has already applied! Please wait ${daysLeft} more day(s) before applying again.`;
          notice.className = "notice error-notice";
          notice.style.display = 'block';
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";

      const discordMessage = {
        username: "NUKENOVA YT",
        avatar_url: "https://i.imgur.com/AfFp7pu.png",
        embeds: [{
          title: "✨ New Staff Application Received! ✨",
          color: 8149247,
          fields: [
            { name: "👤 Minecraft Username", value: `\`${originalUsername}\``, inline: true },
            { name: "🎂 Age", value: `\`${age}\``, inline: true },
            { name: "🌍 Time Zone", value: `\`${timezone}\``, inline: true },
            { name: "🎮 Playstyle", value: `\`${playstyle}\``, inline: true },
            { name: "💬 Discord Username", value: `**${discord}**`, inline: false },
            { name: "📝 Reason to Apply", value: reason, inline: false }
          ],
          timestamp: new Date().toISOString(),
          footer: { text: "NOVA YT Website System" }
        }]
      };

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(discordMessage)
        });

        if (response.ok) {
          localStorage.setItem(`cooldown_${username}`, currentTime.toString());
          notice.innerText = "Success! Your Application sent.";
          notice.className = "notice";
          notice.style.display = 'block';
          form.reset();
          setTimeout(() => {
            window.location.href = "index.html"; // Submit hone ke baad wapas home page par bhej dega
          }, 2000);
        } else {
          throw new Error("Discord server error");
        }
      } catch (error) {
        notice.innerText = "Error: Application nahi bheji ja saki. Network check karein!";
        notice.className = "notice error-notice";
        notice.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Application";
      }
    });
  </script>
</body>
</html>
