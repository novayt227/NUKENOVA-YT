<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEAL A BRAINROT - NUKENOVA YT</title>
  
  <link rel="icon" type="image/jpeg" href="../assets/logo.jpeg" />

  <style>
    :root{
      --bg0:#070A12;
      --text:#EAF0FF;
      --muted:#A9B4DA;
      --brand:#E92EA6;
      --brand2:#7C5CFF;
      --border: rgba(255,255,255,.14);
      --radius: 18px;
    }
    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Backdrop video wallpaper layout setup */
    .video-bg {
      position: fixed;
      inset: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.25;
      background: url('../assets/logo.jpeg') no-repeat center center;
      background-size: cover;
    }

    .form-container {
      width: min(650px, 100%);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #090D1A;
      padding: 32px;
      box-shadow: 0 25px 70px rgba(0,0,0,.6);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .form-header {
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 16px;
    }
    .form-header h2 {
      margin: 0;
      font-size: 28px;
      font-weight: 950;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #FFF, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    form { display: grid; gap: 18px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px){ .row2 { grid-template-columns: 1fr; } }
    
    label { display: flex; flex-direction: column; gap: 8px; color: var(--muted); font-weight: 800; font-size: 13.5px; }
    .optional-tag { color: rgba(255,255,255,0.35); font-weight: 500; font-size: 11px; margin-left: 4px; }
    
    input, textarea, select {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.4);
      color: var(--text);
      padding: 14px;
      outline: none;
      font-weight: 750;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus{ border-color: var(--brand); }
    textarea { min-height: 110px; resize: vertical; }

    /* Custom File Input Styling */
    .file-upload-wrapper {
      position: relative;
      display: block;
      width: 100%;
    }
    /* Hide native file text input styling natively */
    input[type="file"] {
      position: absolute;
      left: 0; top: 0; opacity: 0;
      width: 100%; height: 100%;
      cursor: pointer;
      z-index: 2;
    }
    .file-custom-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.4);
      border-radius: 14px;
      padding: 14px;
      font-weight: 750;
      font-size: 14px;
      color: var(--text);
      transition: border-color 0.2s;
    }
    input[type="file"]:focus + .file-custom-btn,
    input[type="file"]:hover + .file-custom-btn {
      border-color: var(--brand);
    }
    .file-chosen-text {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    .actions {
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .btn {
      padding: 13px 22px;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      transition: .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.14);
    }
    .btn-cancel { background: rgba(255,255,255,0.05); color: #FFF; }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }
    
    .btn-submit { 
      background: linear-gradient(135deg, #E92EA6, #7C5CFF); 
      color: #FFF; 
      border: none;
    }
    .btn-submit:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .notice { 
      padding: 12px; 
      border-radius: 16px; 
      border: 1px solid rgba(46,233,166,.25); 
      background: rgba(46,233,166,.08); 
      color: #CFFAF0; 
      font-weight: 800; 
      display: none; 
      margin-top: 12px; 
      text-align: center;
    }
    .notice.error-notice { border-color: rgba(255,77,109,.25); background: rgba(255,77,109,.08); color: #FFD2DA; }
  </style>
</head>
<body>

  <video autoplay loop muted playsinline webkit-playsinline preload="auto" class="video-bg">
    <source src="../assets/bg-video.mp4" type="video/mp4">
  </video>

  <div class="form-container">
    <div class="form-header">
      <h2>STEAL A BRAINROT</h2>
    </div>
    
    <form id="BrainrotForm">
      <div class="row2">
        <label>
          ROBLOX Username
          <input name="roblox_user" required placeholder="e.g., RobloxPlayer99" />
        </label>
        <label>
          Age <span class="optional-tag">(Optional)</span>
          <input name="age" placeholder="e.g., 16" inputmode="numeric" />
        </label>
      </div>

      <div class="row2">
        <label>
          Preferred Playstyle
          <select name="playstyle" required>
            <option value="Duel">Duel</option>
            <option value="Stealing">Stealing</option>
          </select>
        </label>
        <label>
          Time Zone
          <input name="timezone" required placeholder="e.g., GMT+5:30" />
        </label>
      </div>

      <label>
        Describe your Brainrot
        <textarea name="brainrot_desc" required placeholder="Write details about your brainrot style..."></textarea>
      </label>

      <div class="row2">
        <label>
          Discord Username (for contact)
          <input name="discord" required placeholder="e.g., @titan_nova" />
        </label>
        
        <!-- 🔥 UPDATED: Input type badal kar file manager support de diya hai -->
        <label>
          Media <span class="optional-tag">(Upload Image)</span>
          <div class="file-upload-wrapper">
            <input type="file" id="mediaFileInput" accept="image/*" />
            <div class="file-custom-btn">
              <span>📁 Select Image File</span>
              <span class="file-chosen-text" id="fileChosenText">No file chosen</span>
            </div>
          </div>
        </label>
      </div>

      <div class="actions">
        <a href="/" class="btn btn-cancel">Cancel</a>
        <button class="btn btn-submit" type="submit" id="submitBtn">Submit Trade Form</button>
      </div>
      <div class="notice" id="formNotice"></div>
    </form>
  </div>

  <!-- ADVANCED WEBHOOK PIPELINE WITH FILE STREAM CONVERSION -->
  <script>
    const form = document.getElementById('BrainrotForm');
    const formNotice = document.getElementById('formNotice');
    const submitBtn = document.getElementById('submitBtn');
    const mediaFileInput = document.getElementById('mediaFileInput');
    const fileChosenText = document.getElementById('fileChosenText');

    // UI Feedback jab player file select karega file manager se
    mediaFileInput.addEventListener('change', () => {
      if (mediaFileInput.files.length > 0) {
        fileChosenText.textContent = mediaFileInput.files[0].name;
        fileChosenText.style.color = '#2EE9A6'; // Green confirmation indicator text
      } else {
        fileChosenText.textContent = 'No file chosen';
        fileChosenText.style.color = 'rgba(255,255,255,0.4)';
      }
    });

    // Helper pipeline function to read local files natively inside browser memory
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const robloxUser = formData.get('roblox_user').trim();
      const age = formData.get('age') || 'Not provided';
      const playstyle = formData.get('playstyle');
      const timezone = formData.get('timezone');
      const brainrotDesc = formData.get('brainrot_desc');
      const discord = formData.get('discord');

      const webhookUrl = "https://discord.com/api/webhooks/1508431839776211046/elzQXz8KrQKAGIDNXrsPvjPK5pfUv-oiWjpaYbbZCDdxfZcOZLpVyCTY5_pAaoCs553I";

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";

      // Standard multi-part form data pipeline configuration for attachments upload to Discord
      const discordPayload = new FormData();

      const embedMessage = {
        username: "NOVA YT Brainrot System",
        avatar_url: "https://i.imgur.com/AfFp7pu.png",
        embeds: [{
          title: "💸 New Brainrot Trade Requested! 💸",
          color: 15281830,
          fields: [
            { name: "幕 ROBLOX Username", value: `\`${robloxUser}\``, inline: true },
            { name: "🎂 Age", value: `\`${age}\``, inline: true },
            { name: "🌍 Time Zone", value: `\`${timezone}\``, inline: true },
            { name: "⚔️ Playstyle", value: `\`${playstyle}\``, inline: true },
            { name: "💬 Discord Contact", value: `**${discord}**`, inline: false },
            { name: "🧠 Brainrot Description", value: brainrotDesc, inline: false }
          ],
          timestamp: new Date().toISOString(),
          footer: { text: "Brainrot Trade Module" }
        }]
      };

      // Check if player selected a file from local device storage manager natively
      if (mediaFileInput.files.length > 0) {
        const imageFile = mediaFileInput.files[0];
        
        // Append actual raw media attachments block natively into payload streams
        discordPayload.append('files[0]', imageFile, imageFile.name);
        
        // Link embed image target referencing file schema attachments pipeline natively
        embedMessage.embeds[0].image = { url: `attachment://${imageFile.name}` };
      }

      // Final json payload injection rule
      discordPayload.append('payload_json', JSON.stringify(embedMessage));

      try {
        const response = await fetch(webhookUrl, {
          method: 'POST',
          body: discordPayload
        });

        if (response.ok) {
          formNotice.innerText = "Success! Your Brainrot Trade data sent successfully.";
          formNotice.className = "notice";
          formNotice.style.display = 'block';
          form.reset();
          fileChosenText.textContent = 'No file chosen';
          fileChosenText.style.color = 'rgba(255,255,255,0.4)';
          setTimeout(() => {
            window.location.href = "/"; 
          }, 2000);
        } else {
          throw new Error();
        }
      } catch (error) {
        formNotice.innerText = "Error: Transmission failed. Check your network or file size.";
        formNotice.className = "notice error-notice";
        formNotice.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Trade Form";
      }
    });
  </script>
</body>
</html>
